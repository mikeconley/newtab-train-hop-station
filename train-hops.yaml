    deployed_release_100: N/A
    deployed_beta_100: N/A
    notes: This train-hop was cancelled due to issues found by QA (bug 2025439 and bug 2025444). A new XPI will be spun out. This train-hop was primarily driven by a capability to experiment with the default number of shortcuts (total and rows). Notably, it was meant to be the first train-hop to perform a React upgrade, moving us from React 16 to 19.2.0. It also added client-side support for the HNT editor controls for whether follow or block makes sense for a custom section. This was also the first train-hop to include a train-hopped Expo component (asrouter-newtab-message).

